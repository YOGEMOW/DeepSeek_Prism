<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP 中央网关</title>
  <style>
    :root {
      --sidebar-bg: #1f2937;
      --sidebar-text: #cbd5e1;
      --sidebar-active: #3b82f6;
      --header-bg: #ffffff;
      --page-bg: #f3f4f6;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --text-muted: #6b7280;
      --accent: #3b82f6;
      --danger: #ef4444;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--page-bg);
      color: var(--text);
      font-size: 14px;
    }
    a { color: inherit; text-decoration: none; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 200px;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sidebar .brand {
      padding: 18px 16px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      border-bottom: 1px solid #374151;
    }
    .sidebar nav { padding: 12px 8px; flex: 1; }
    .sidebar nav a {
      display: block;
      padding: 10px 12px;
      border-radius: 6px;
      color: var(--sidebar-text);
      margin-bottom: 4px;
    }
    .sidebar nav a:hover { background: #374151; color: #fff; }
    .sidebar nav a.active { background: var(--sidebar-active); color: #fff; }
    .sidebar .version {
      padding: 12px 16px;
      font-size: 12px;
      color: #9ca3af;
      border-top: 1px solid #374151;
    }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .header {
      height: 56px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header .user { display: flex; align-items: center; gap: 8px; color: var(--text-muted); }
    .header .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px;
    }
    .content { padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
    }
    .card-body { padding: 18px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
    .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
    .link-download { color: var(--accent); font-size: 13px; }
    .filter { color: var(--text-muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: var(--text-muted); font-weight: 600; background: #f9fafb; }
    td .key { font-family: Consolas, monospace; color: var(--text-muted); }
    td .recent { color: var(--text-muted); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .input-wrap { display: flex; gap: 8px; }
    .input {
      flex: 1;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 13px;
      outline: none;
    }
    .input:focus { border-color: var(--accent); }
    textarea.input { height: 80px; padding: 10px; resize: vertical; font-family: Consolas, monospace; line-height: 1.5; }
    .range-wrap { display: flex; align-items: center; gap: 12px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); }
    .range-value { font-size: 13px; color: var(--text-muted); min-width: 36px; }
    .pagination { display: flex; gap: 6px; align-items: center; margin-top: 14px; font-size: 13px; }
    .pagination span { padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px; color: var(--text-muted); }
    .pagination .active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .hint { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px; }
    .import-actions { margin-top: 12px; display: flex; gap: 10px; }
    @media (max-width: 900px) {
      .two-col { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .sidebar { display: none; }
      .content { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">MCP 中央网关</div>
      <nav>
        <a href="#" class="active">首页</a>
        <a href="#">MCP 管理</a>
        <a href="#">分级管理</a>
        <a href="#">设置</a>
        <a href="#">关于</a>
      </nav>
      <div class="version">v0.1.0</div>
    </aside>
    <div class="main">
      <header class="header">
        <h1>MCP 中央网关</h1>
        <div class="user">
          <span>你好，taka</span>
          <span class="avatar">T</span>
        </div>
      </header>
      <div class="content">
        <section class="card">
          <div class="card-header"><span>API Key 管理</span></div>
          <div class="card-body">
            <div class="toolbar">
              <button class="btn">＋ 管理 API KEY</button>
              <span class="filter">创建时间 <select class="input" style="width:130px;height:30px;"><option>最近 7 天</option><option>最近 30 天</option><option>全部</option></select></span>
              <a class="link-download" href="#">[下载源]</a>
            </div>
            <table>
              <thead>
                <tr><th>名称</th><th>KEY</th><th>最近</th><th>操作</th></tr>
              </thead>
              <tbody>
                <tr><td>生产环境</td><td class="key">sk-mcp-••••••a1b2</td><td class="recent">2 分钟前</td><td><button class="btn btn-danger btn-outline">删除</button></td></tr>
                <tr><td>测试环境</td><td class="key">sk-mcp-••••••c3d4</td><td class="recent">1 小时前</td><td><button class="btn btn-danger btn-outline">删除</button></td></tr>
                <tr><td>本地开发</td><td class="key">sk-mcp-••••••e5f6</td><td class="recent">昨天</td><td><button class="btn btn-danger btn-outline">删除</button></td></tr>
              </tbody>
            </table>
          </div>
        </section>
        <div class="two-col">
          <section class="card">
            <div class="card-header"><span>MCP 权限</span></div>
            <div class="card-body">
              <div class="form-group">
                <label>MCP 服务</label>
                <div class="input-wrap">
                  <input class="input" type="text" placeholder="搜索或添加 MCP 服务">
                  <button class="btn">＋ 添加</button>
                </div>
              </div>
              <div class="form-group">
                <label>MCP 名称</label>
                <input class="input" type="text" placeholder="例如：文件服务器 / 数据库网关">
              </div>
              <div class="form-group">
                <label>版本传输率</label>
                <div class="range-wrap">
                  <input type="range" min="0" max="100" value="60">
                  <span class="range-value">60%</span>
                </div>
              </div>
              <div class="form-group">
                <label>MCP 描述</label>
                <textarea class="input">这里是 MCP 描述，这里是 MCP 描述</textarea>
              </div>
              <div class="pagination">
                <span>&lt;</span><span class="active">1</span><span>2</span><span>…</span><span>(last)</span>
              </div>
            </div>
          </section>
          <section class="card">
            <div class="card-header"><span>从 JSON 导入</span></div>
            <div class="card-body">
              <p class="hint">* 请从 MCP Server 的介绍页面复制配置 JSON，并粘贴到输入框中。</p>
              <textarea class="input" style="height:170px;" placeholder='{ "mcpServers": { ... } }'></textarea>
              <div class="import-actions">
                <button class="btn">导入配置</button>
                <button class="btn btn-outline">清空</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
